# =============================================
# 配置模板（脱敏）
# 使用方式：复制本文件为 config.yaml，按本机环境填写真实值
# ⚠️ config.yaml 含数据库密码与 JWT 密钥，已在 .gitignore 中排除，禁止提交
# =============================================

# 被测系统环境
base_url: http://localhost:8080

# MySQL 数据库
mysql:
  host: localhost
  port: 3306
  user: root
  password: "填写你的 MySQL 密码"
  database: sky_take_out
  charset: utf8mb4

# ---- 登录与 JWT 配置 ----
auth:
  # 管理端：走真实登录接口获取 token
  admin_login_url: /admin/employee/login
  admin_username: admin
  admin_password: "填写你的管理端密码"
  admin_token_header: token          # 对应后端 jwt.admin-token-name

  # 用户端：本地无法复现微信授权，改用自签 JWT
  user_token_header: authentication  # 对应后端 jwt.user-token-name
  user_secret_key: "填写用户端 JWT 密钥"
  user_secret_ttl_ms: 2592000000
  user_claims: {userId: 4}           # user 表中真实存在的 id

  # 自签算法（对齐后端 JwtUtil）
  sign_algorithm: HS256

# 日志
logging:
  level: INFO
  log_file: logs/run.log
