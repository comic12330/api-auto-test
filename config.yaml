# =============================================
# 环境配置（苍穹外卖 sky-take-out）
# 说明：所有真实值来自本机代码/DB实测（见 框架搭建进度.md 〇节）
# =============================================

# 被测系统环境
base_url: http://localhost:8080

# MySQL 数据库
mysql:
  host: localhost
  port: 3306
  user: root
  password: "123456"
  database: sky_take_out
  charset: utf8mb4

# ---- 登录与 JWT 配置（仅供 fixture 自签/理解鉴权用）----
# 正常情况下走登录接口拿 token。
# 用户端因本地无法复现微信授权，改用自签 JWT（见 conftest.py 说明）。
auth:
  # 管理端：走真实登录接口
  admin_login_url: /admin/employee/login
  admin_username: admin
  admin_password: "123456"
  admin_token_header: token          # 对应后端 jwt.admin-token-name

  # 用户端：本地无法微信授权 → 自签 JWT
  user_token_header: authentication  # 对应后端 jwt.user-token-name
  user_secret_key: itheima           # 对应后端 jwt.user-secret-key
  user_secret_ttl_ms: 2592000000
  user_claims: {userId: 4}           # user 表里真实存在的 id（openid oiGlR190MHiYNWijD7ZSrkncZSSM）

  # 自签算法（对齐后端 JwtUtil：HS256，secretKey.getBytes(UTF-8) 做 HMAC key）
  sign_algorithm: HS256

# 日志
logging:
  level: INFO
  # 请求日志目录（relative to 项目根）
  log_file: logs/run.log
